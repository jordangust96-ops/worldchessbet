<!doctype html>

    <!-- Crawler-readable homepage metadata. React Helmet replaces these tags

    <title data-rh="true">Play Chess for Real Money — Head-to-Head Cash Contests | ChessBet</title>
    <meta data-rh="true" name="description" content="Play head-to-head blitz, rapid, and classical chess for real money on ChessBet, with server-verified games, Stockfish screening, and human fair-play review." />

    <meta data-rh="true" property="og:type" content="website" />
    <meta data-rh="true" property="og:title" content="Play Chess for Real Money — Head-to-Head Cash Contests | ChessBet" />

    <meta data-rh="true" property="og:image:alt" content="ChessBet logo" />
    <meta data-rh="true" property="og:locale" content="en_US" />

    <meta data-rh="true" name="twitter:card" content="summary" />

    <meta data-rh="true" name="twitter:description" content="Play head-to-head blitz, rapid, and classical chess for real money on ChessBet, with server-verified games, Stockfish screening, and human fair-play review." />
    <meta data-rh="true" name="twitter:image" content="https://media.base44.com/images/public/6a4ed72536c51cb3280d2bc6/7eb5eb625_logo-removebg-preview.png" />
    <meta data-rh="true" name="twitter:image:alt" content="ChessBet logo" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://worldchessbet.com/#organization",
            "name": "ChessBet",
            "url": "https://worldchessbet.com/",
            "logo": {
              "@type": "ImageObject",
              "url": "https://media.base44.com/images/public/6a4ed72536c51cb3280d2bc6/7eb5eb625_logo-removebg-preview.png"
            },
            "sameAs": ["https://twitter.com/worldchessbet"]
          },
          {
            "@type": "WebSite",
            "@id": "https://worldchessbet.com/#website",
            "url": "https://worldchessbet.com/",
            "name": "ChessBet",
            "alternateName": ["World Chess Bet", "WorldChessBet"],
            "publisher": { "@id": "https://worldchessbet.com/#organization" },
            "inLanguage": "en-US"
          }
        ]
      }

    <!-- GA4, Meta Pixel, and product analytics are queued by the application
         and downloaded after first paint/interaction, keeping third-party code
         off the mobile critical rendering path. -->
  </head>
