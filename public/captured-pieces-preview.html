}else{
  const frame=document.getElementById('preview-frame');
  const layout=document.getElementById('layout');
  const scene=document.getElementById('scene');
  const connection=document.getElementById('connection');
  document.getElementById('preview-controls').hidden=false;
  frame.hidden=false;
  layout.value=innerWidth<1024?'mobile':'desktop';
  function fitFrame(){
    frame.style.maxWidth=layout.value==='mobile'?'390px':'none';
    if(layout.value==='desktop' && innerWidth<1024){
      frame.style.minWidth='1024px';
    }else{
      frame.style.minWidth='0';
    }
  }
  function showSample(){
    fitFrame();
    const sampleUrl=location.pathname+'?sample=1&scene='+scene.value+'&connection='+connection.value;
    document.getElementById('preview-full').href=sampleUrl;
    frame.src=sampleUrl;
  }
  layout.addEventListener('change',showSample);
  scene.addEventListener('change',showSample);
  connection.addEventListener('change',showSample);
  addEventListener('resize',fitFrame);
  showSample();
}
