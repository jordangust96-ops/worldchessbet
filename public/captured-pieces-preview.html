  frame.hidden=false;
  layout.value=innerWidth<1024?'mobile':'desktop';
  function fitFrame(){

    if(layout.value==='desktop' && innerWidth<1024){
      frame.style.minWidth='1024px';
    }else{
      frame.style.minWidth='0';

  }
  function showSample(){
    fitFrame();
    frame.src=location.pathname+'?sample=1&scene='+scene.value;

  layout.addEventListener('change',showSample);
  scene.addEventListener('change',showSample);
  addEventListener('resize',fitFrame);
  showSample();
